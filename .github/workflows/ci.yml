name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Ubuntu tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Install jq on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Run portable contract suite
        run: bash tests/run.sh

      - name: Run ShellCheck
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          set -- install.sh assets/*.sh scripts/*.sh tests/*.sh
          shellcheck --exclude=SC2294 "$@"
          printf '%s\n' 'SHELLCHECK_STATUS=PASSED'
