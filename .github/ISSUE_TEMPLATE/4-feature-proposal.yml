name: Focused feature proposal
description: Propose a bounded improvement to the writing-goals contract or supported workflow.
title: "[Proposal]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe a concrete problem and expected contract. Report security vulnerabilities through
        [private vulnerability reporting](https://github.com/iliaim/writing-goals/security/advisories/new).
        For abusive behavior or content on GitHub that requires private handling, follow GitHub's
        [abuse-reporting instructions](https://docs.github.com/en/communities/maintaining-your-safety-on-github/reporting-abuse-or-spam).
        See the [Code of Conduct](https://github.com/iliaim/writing-goals/blob/main/CODE_OF_CONDUCT.md)
        for the project's enforcement boundary. Do not include secrets, vulnerability details,
        conduct allegations, or other private data in this public issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation or user problem does the current behavior create?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected contract
      description: What observable behavior should change, and what should remain unchanged?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Identify affected adapters, shared policy, gates, installer behavior, or documentation.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification idea
      description: How could the proposed outcome be checked deterministically?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or smaller approaches already considered.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I searched existing issues and pull requests for this proposal.
          required: true
        - label: This proposal contains no secrets, vulnerability details, conduct allegations, or private data.
          required: true
