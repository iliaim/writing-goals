# Codex UI metadata + invocation policy for the writing-goals skill.
#
# The frontmatter in ../SKILL.md is `name` + `description` ONLY; all UI metadata
# and any invocation policy live here (verified: Codex reads agents/openai.yaml
# alongside SKILL.md — real examples: impeccable, security-best-practices, aivv).
#
# The skill remains model-invocable by its description (implicit invocation is
# left at the default = allowed), and is also reachable as `$writing-goals` or
# via the /skills picker.
#
# To make it MANUAL-only (no auto-trigger by description), add either of:
#     invocation_policy: explicit
#     allow_implicit_invocation: false
interface:
  display_name: "Writing Goals"
  short_description: "Author bounded goal contracts with reproducible acceptance checks."
  default_prompt: "Use writing-goals to resolve the end-to-end delivery outcome from context, record read-first sources and explicit non-goals, present a reviewable staged plan before implementation, and record cumulative Given/When/Then acceptance criteria, documentation impact, exact verification, checkpoints, and proportional escalation."
